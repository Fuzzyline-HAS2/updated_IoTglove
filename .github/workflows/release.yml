name: Firmware Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          python3 scripts/check_release_version.py --tag "${TAG}"
          CHANNEL="$(python3 scripts/firmware_metadata.py channel "${TAG}")"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "channel=${CHANNEL}" >> "${GITHUB_OUTPUT}"

      - name: Test release profile configuration
        run: python3 -m unittest discover -s tests -v

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: store2-badland
            wifi_ssid: ${{ vars.GLOVE_WIFI_SSID_STORE2_BADLAND }}
          - profile: store2-city
            wifi_ssid: ${{ vars.GLOVE_WIFI_SSID_STORE2_CITY }}
          - profile: store3-error
            wifi_ssid: ${{ vars.GLOVE_WIFI_SSID_STORE3_ERROR }}
    env:
      PLATFORMIO_CORE_VERSION: "6.1.19"
      PIO_CACHE_DIR: ${{ github.workspace }}/.platformio-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required release settings
        shell: bash
        env:
          HMAC_SECRET_VALUE: ${{ secrets.HMAC_SECRET }}
          GLOVE_WIFI_SSID_VALUE: ${{ matrix.wifi_ssid }}
          GLOVE_WIFI_PASS_VALUE: ${{ secrets.GLOVE_WIFI_PASS }}
        run: |
          set -euo pipefail
          test -n "${HMAC_SECRET_VALUE}" || (echo "Missing HMAC_SECRET secret" && exit 1)
          test -n "${GLOVE_WIFI_PASS_VALUE}" || (echo "Missing GLOVE_WIFI_PASS secret" && exit 1)
          test -n "${GLOVE_WIFI_SSID_VALUE}" || (echo "Missing Wi-Fi SSID repository variable for ${{ matrix.profile }}" && exit 1)

      - name: Generate profile secrets header
        shell: bash
        env:
          HMAC_SECRET_VALUE: ${{ secrets.HMAC_SECRET }}
          GLOVE_WIFI_SSID_VALUE: ${{ matrix.wifi_ssid }}
          GLOVE_WIFI_PASS_VALUE: ${{ secrets.GLOVE_WIFI_PASS }}
        run: python3 scripts/release_profiles.py write-secrets --profile "${{ matrix.profile }}"

      - name: Resolve artifact names
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r name value; do
            echo "${name^^}=${value}" >> "${GITHUB_ENV}"
          done < <(python3 scripts/release_profiles.py assets \
            --profile "${{ matrix.profile }}" \
            --channel "${{ needs.prepare.outputs.channel }}")

      - name: Restore PlatformIO package cache
        uses: actions/cache@v4
        with:
          path: .platformio-cache
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_CORE_VERSION }}-${{ hashFiles('platformio.ini', 'Dockerfile') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PLATFORMIO_CORE_VERSION }}-
            pio-${{ runner.os }}-

      - name: Prepare PlatformIO cache directory
        run: mkdir -p "${PIO_CACHE_DIR}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iotglove-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build TTGO and Beetle firmware
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e PLATFORMIO_CORE_VERSION="${PLATFORMIO_CORE_VERSION}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${PIO_CACHE_DIR}:/opt/platformio" \
            iotglove-builder \
            /bin/sh -lc 'set -eu
              git config --global --add safe.directory /work
              pio run -e ttgo-t8-v171 -e beetle-c3-location
            '

      - name: Fix PlatformIO cache ownership
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "${PIO_CACHE_DIR}" || true

      - name: Create profile release artifacts
        shell: bash
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p dist

          cp ".pio/build/ttgo-t8-v171/firmware.bin" "dist/${TTGO_FIRMWARE}"
          cp ".pio/build/beetle-c3-location/firmware.bin" "dist/${BEETLE_FIRMWARE}"

          python3 scripts/sign_firmware.py \
            --firmware "dist/${TTGO_FIRMWARE}" \
            --out "dist/${TTGO_SIGNATURE}"
          python3 scripts/sign_firmware.py \
            --firmware "dist/${BEETLE_FIRMWARE}" \
            --out "dist/${BEETLE_SIGNATURE}"

          python3 scripts/generate_build_info.py \
            --firmware "dist/${TTGO_FIRMWARE}" \
            --signature "dist/${TTGO_SIGNATURE}" \
            --output "dist/${TTGO_BUILD_INFO}" \
            --channel "${CHANNEL}" \
            --profile "${PROFILE}" \
            --env ttgo-t8-v171 \
            --firmware-asset "${TTGO_FIRMWARE}" \
            --signature-asset "${TTGO_SIGNATURE}"
          python3 scripts/generate_build_info.py \
            --firmware "dist/${BEETLE_FIRMWARE}" \
            --signature "dist/${BEETLE_SIGNATURE}" \
            --output "dist/${BEETLE_BUILD_INFO}" \
            --channel "${CHANNEL}" \
            --profile "${PROFILE}" \
            --env beetle-c3-location \
            --firmware-asset "${BEETLE_FIRMWARE}" \
            --signature-asset "${BEETLE_SIGNATURE}"

          python3 scripts/make_manifest.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --channel "${CHANNEL}" \
            --profile "${PROFILE}" \
            --firmware "dist/${TTGO_FIRMWARE}" \
            --signature "dist/${TTGO_SIGNATURE}" \
            --build-info "dist/${TTGO_BUILD_INFO}" \
            --firmware-asset "${TTGO_FIRMWARE}" \
            --signature-asset "${TTGO_SIGNATURE}" \
            --build-info-asset "${TTGO_BUILD_INFO}" \
            --out "dist/${TTGO_MANIFEST}"
          python3 scripts/make_manifest.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --channel "${CHANNEL}" \
            --profile "${PROFILE}" \
            --firmware "dist/${BEETLE_FIRMWARE}" \
            --signature "dist/${BEETLE_SIGNATURE}" \
            --build-info "dist/${BEETLE_BUILD_INFO}" \
            --firmware-asset "${BEETLE_FIRMWARE}" \
            --signature-asset "${BEETLE_SIGNATURE}" \
            --build-info-asset "${BEETLE_BUILD_INFO}" \
            --out "dist/${BEETLE_MANIFEST}"

          find dist -maxdepth 1 -type f -print | sort

      - name: Upload profile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all profile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - name: Verify complete artifact set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 24
          find dist -maxdepth 1 -type f -print | sort

      - name: Upload GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_FLAGS=(--verify-tag --title "${TAG}" --notes "Automated firmware release ${TAG}")
            if [ "${CHANNEL}" = "prd" ]; then
              RELEASE_FLAGS+=(--latest)
            else
              RELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "${TAG}" "${RELEASE_FLAGS[@]}"
          fi
          gh release upload "${TAG}" dist/* --clobber

          if [ "${CHANNEL}" != "prd" ]; then
            ALIAS_TAG="${CHANNEL}-latest"
            git tag -f "${ALIAS_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${ALIAS_TAG}" --force

            if ! gh release view "${ALIAS_TAG}" >/dev/null 2>&1; then
              gh release create "${ALIAS_TAG}" \
                --verify-tag \
                --title "${ALIAS_TAG}" \
                --notes "Latest ${CHANNEL} firmware pointer. Current version: ${TAG}" \
                --prerelease
            else
              gh release edit "${ALIAS_TAG}" \
                --title "${ALIAS_TAG}" \
                --notes "Latest ${CHANNEL} firmware pointer. Current version: ${TAG}" \
                --prerelease
            fi

            gh release upload "${ALIAS_TAG}" dist/* --clobber
          fi
